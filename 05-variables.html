<!DOCTYPE html>
<html>
  <head>
    <title>Variables</title>
    
  </head>

  <body>
   

  <script>

    //assigning a value to a variable.
    let variable1 = 10;
    console.log(variable1);

    //const variable cannot be reassigned a value.
    const calculation = 2+2;
    console.log(calculation);
    console.log(calculation + 10);

    const result = calculation + 2;
    console.log(result);


    const message = 'Hey Ali';
    console.log(message); 

   //reassigning a value to the same variable.
    variable1 = 20;
    console.log(variable1);

    variable1 = variable1 + 1;
    console.log(variable1);

    //type1 to create a variable.  (use if changes required)
    let variable4 = 5;

    //type2 to create a variable. (use as default)
    const variable2 = 20;

    //type3 to create a variable.
    var variable3 = 3; 

    //checking the type of variable.
    console.log(typeof variable1);
    console.log(typeof message);
  


  </script>


  </body>
  </html>
