<!DOCTYPE html>
<html>
  <head>
    <title>Variables</title>
    
  </head>

  <body>
   

  <script>

    //assigning a value to a variable.
    let variable1 = 10;
    console.log(variable1);

    let calculation = 2+2;
    console.log(calculation);
    console.log(calculation + 10);

    let result = calculation + 2;
    console.log(result);


    let message = 'Hey Ali';
    console.log(message); 

   //reassigning a value to the same variable.
    variable1 = 20;
    console.log(variable1);

    variable1 = variable1 + 1;
    console.log(variable1);




  </script>


  </body>
  </html>
