    <p>Rock Paper Scissors</p>

    <button onclick="

    const randomNumber =(Math.random());             // created a random number by the computer.
    let computerMove = '';

    if (randomNumber >= 0 && randomNumber < 1/3) {
      computerMove = 'Rock';

    } else if (randomNumber >= 1/3 && randomNumber < 2/3) {   // computer selects the moves on the basis of number it created.
      computerMove = 'Paper';

    } else if (randomNumber >= 2/3 && randomNumber < 1) {
      computerMove = 'Scissors';
    }
  
      let result =''; 
      if (computerMove === 'Rock') {
      result= 'Its a Tie.';

    }  else if (computerMove === 'Paper') {              // compared the move with our move to get the result.
      result = 'You loose.';

    } else if (computerMove === 'Scissors') {
       result = 'You Win.';
    }
       
    alert(`You picked Rock. Computer Picked ${computerMove}. ${result}`);  // displays the result as pop-up
    ">
    Rock</button>
